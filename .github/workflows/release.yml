name: Release Pipeline

'on':
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.allow_failure || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: shae
            asset_name: shae-${{ github.ref_name }}-linux-x86_64.tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact_name: shae
            asset_name: shae-${{ github.ref_name }}-linux-x86_64-musl.tar.gz
            env:
              PKG_CONFIG_ALLOW_CROSS: "1"
              ALSA_NO_PKG_CONFIG: "1"
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: shae
            asset_name: shae-${{ github.ref_name }}-linux-aarch64.tar.gz
            allow_failure: true
            env:
              PKG_CONFIG_ALLOW_CROSS: "1"
              ALSA_NO_PKG_CONFIG: "1"
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            artifact_name: shae
            asset_name: shae-${{ github.ref_name }}-linux-aarch64-musl.tar.gz
            allow_failure: true
            env:
              PKG_CONFIG_ALLOW_CROSS: "1"
              ALSA_NO_PKG_CONFIG: "1"
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: shae
            asset_name: shae-${{ github.ref_name }}-macos-arm64.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: shae
            asset_name: shae-${{ github.ref_name }}-macos-x86_64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: shae.exe
            asset_name: shae-${{ github.ref_name }}-windows-x86_64.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libasound2-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libxinerama-dev

      - name: Install Linux musl dependencies
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -y
          sudo -E apt-get install -y --no-install-recommends musl-tools musl-dev
          sudo ln -sf $(which musl-gcc) /usr/local/bin/x86_64-linux-musl-gcc

      - name: Install Linux aarch64 cross-compiler
        if: matrix.target == 'aarch64-unknown-linux-gnu' || matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -y
          sudo -E apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Binary (Linux aarch64-gnu)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        env:
          PKG_CONFIG_ALLOW_CROSS: 1
          ALSA_NO_PKG_CONFIG: 1
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build Binary (Linux aarch64-musl)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        env:
          PKG_CONFIG_ALLOW_CROSS: 1
          ALSA_NO_PKG_CONFIG: 1
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_musl: aarch64-linux-gnu-gcc
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build Binary (Linux x86_64-musl)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        env:
          PKG_CONFIG_ALLOW_CROSS: 1
          ALSA_NO_PKG_CONFIG: 1
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build Binary (Default)
        if: matrix.target != 'aarch64-unknown-linux-gnu' && matrix.target != 'aarch64-unknown-linux-musl' && matrix.target != 'x86_64-unknown-linux-musl'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Release Archive (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          ./scripts/release.sh --version ${{ github.ref_name }} --dist dist --package ${{ matrix.target }} target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
          mv dist/${{ matrix.asset_name }} .

      - name: Package Release Archive (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          ./scripts/release.sh --version ${{ github.ref_name }} --dist dist --package ${{ matrix.target }} target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
          mv dist/${{ matrix.asset_name }} .

      - name: Upload Binary Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.target }}
          path: ${{ matrix.asset_name }}
          if-no-files-found: error

  build-macos-universal:
    name: Build macOS Universal (arm64 + x86_64)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Build arm64
        run: cargo build --release --target aarch64-apple-darwin

      - name: Build x86_64
        run: cargo build --release --target x86_64-apple-darwin

      - name: Create Universal Mach-O Binary
        run: |
          mkdir -p target/universal/release
          lipo -create -output target/universal/release/shae \
            target/aarch64-apple-darwin/release/shae \
            target/x86_64-apple-darwin/release/shae
          file target/universal/release/shae

      - name: Package Universal Archive
        run: |
          ./scripts/release.sh --version ${{ github.ref_name }} --dist dist --package macos-universal target/universal/release/shae
          mv dist/shae-${{ github.ref_name }}-macos-universal.tar.gz .

      - name: Upload Universal Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-macos-universal
          path: shae-${{ github.ref_name }}-macos-universal.tar.gz
          if-no-files-found: error

  build-vscode-extension:
    name: Package VS Code Extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Extension Dependencies
        working-directory: editors/vscode
        run: npm ci

      - name: Compile Extension
        working-directory: editors/vscode
        run: npm run compile

      - name: Package VSIX
        working-directory: editors/vscode
        run: npx --yes @vscode/vsce package --no-dependencies

      - name: Upload VSIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-vscode-extension
          path: editors/vscode/*.vsix
          if-no-files-found: error

  publish-release:
    name: Publish Release & Multi-Platform Distribution
    needs: [build-binaries, build-macos-universal, build-vscode-extension]
    if: always() && !cancelled() && needs.build-binaries.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Staging Directory
        run: mkdir -p dist

      - name: Download Binary Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      - name: Generate SHA-256 Checksums & Validate Packages
        run: |
          ./scripts/release.sh --checksums --dist dist
          ./scripts/release.sh --verify dist
          echo "=== SHA-256 Release Checksums ==="
          cat dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Shae ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: dist/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
