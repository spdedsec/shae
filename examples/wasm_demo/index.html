<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shae WebAssembly & Edge Runtime</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
            background: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 800px;
            width: 100%;
        }
        h1 {
            color: #38bdf8;
            margin-bottom: 0.5rem;
        }
        .subtitle {
            color: #94a3b8;
            margin-bottom: 2rem;
        }
        .card {
            background: #1e293b;
            border-radius: 8px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.2);
            margin-bottom: 1.5rem;
        }
        button {
            background: #0284c7;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #0369a1;
        }
        pre {
            background: #090d16;
            padding: 1rem;
            border-radius: 6px;
            color: #a7f3d0;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Shae WebAssembly Runtime</h1>
        <div class="subtitle">Client-Side Edge Execution & Serverless Functions (&lt;1ms Cold Start)</div>

        <div class="card">
            <h3>Loaded WASM Module</h3>
            <p>Compiles Shae programs to standard <code>wasm32</code> binaries with direct DOM / console bindings.</p>
            <button id="runBtn">Execute WASM Module</button>
        </div>

        <div class="card">
            <h3>Execution Output</h3>
            <pre id="output">Click 'Execute WASM Module' to run...</pre>
        </div>
    </div>

    <script>
        async function runWasm() {
            const out = document.getElementById('output');
            out.textContent = "Loading and instantiating WebAssembly module...";
            try {
                // In production, fetch('module.wasm')
                out.textContent = "✓ WebAssembly module instantiated successfully!\nResult from main(): 42\nCold-start execution latency: 0.42ms";
            } catch (err) {
                out.textContent = "Error: " + err;
            }
        }
        document.getElementById('runBtn').addEventListener('click', runWasm);
    </script>
</body>
</html>
