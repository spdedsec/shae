[package]
name = "shae"
version = "0.2.0"
edition = "2024"

[[bin]]
name = "shae"
path = "src/main.rs"

[lib]
name = "shae"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
indexmap = "2.0"
strsim = "0.11"
reqwest = { version = "0.13.5", features = ["blocking"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2.1"
ring = "0.17"
base64 = "0.22"
regex = "1.10"
toml = "0.8"

[dev-dependencies]
rcgen = "0.13"
